<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mansoor Farooq — Full-Stack Developer, Karachi. Building custom web applications, SaaS products, and native Android apps with Next.js, Node.js, PostgreSQL, and Kotlin." />
    <title>Mansoor Farooq — Full-Stack Developer | Karachi</title>
    
    <!-- IBM Plex Superfamily Only: Sans Condensed (Display), Sans (Body/Title), Mono (Data/Telemetry) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230B1220'/><text y='.72em' x='.22em' font-size='65' font-family='monospace' font-weight='700' fill='%231E5EFF'>M</text></svg>" />
    
    <style>
      :root {
        --ink: #0B1220;
        --surface: #F8F9FA;
        --card: #FFFFFF;
        --muted: #4B5565;
        --line: #E2E6EC;
        --accent: #0284C7;
        --accent-subtle: #E0F2FE;
        --success: #059669;
        --success-subtle: #ECFDF5;
        --shadow: 0 1px 3px rgba(11, 18, 32, 0.05), 0 1px 2px rgba(11, 18, 32, 0.03);
        --shadow-raised: 0 10px 25px -5px rgba(11, 18, 32, 0.08), 0 8px 10px -6px rgba(11, 18, 32, 0.04);
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background-color: var(--surface);
        color: var(--ink);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      ::selection {
        background: var(--ink);
        color: #FFFFFF;
      }

      /* Strict Accessible Focus Ring */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
